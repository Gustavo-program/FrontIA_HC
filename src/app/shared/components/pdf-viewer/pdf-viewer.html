<div class="pdf-container" [style.height]="height">
  @if (loading) {
    <div class="loading-overlay">
      <mat-spinner diameter="40"></mat-spinner>
      <span>Cargando expediente original escaneado...</span>
    </div>
  }

  @if (safeUrl) {
    <div class="pdf-wrapper">
      <div class="pdf-toolbar">
        <div class="d-flex align-center gap-2">
          <mat-icon class="pdf-icon">picture_as_pdf</mat-icon>
          <span class="pdf-title">Expediente Clínico Digitalizado (Archivo Escaneado Original)</span>
        </div>
        <button mat-stroked-button class="btn-external" (click)="openExternal()" title="Abrir en pestaña nueva o pantalla completa">
          <mat-icon>open_in_new</mat-icon> Abrir en pestaña nueva / Imprimir
        </button>
      </div>

      <iframe
        [src]="safeUrl"
        class="pdf-iframe"
        title="Expediente Clínico Escaneado Original"
        type="application/pdf">
      </iframe>
    </div>
  } @else if (!loading) {
    <div class="empty-pdf">
      <mat-icon class="icon">picture_as_pdf</mat-icon>
      <p>No hay un archivo PDF escaneado disponible para visualizar.</p>
    </div>
  }
</div>
