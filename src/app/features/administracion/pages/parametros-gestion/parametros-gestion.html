<div class="parametros-page">
  <app-page-header
    title="Parámetros Operativos del Sistema (RN-01, RN-06)"
    subtitle="Configuración central de umbrales de Inteligencia Artificial y reglas de agenda">
  </app-page-header>

  <div class="cards-grid">
    @for (p of parametros(); track p.clave) {
      <mat-card class="param-card">
        <mat-card-header>
          <mat-icon mat-card-avatar color="primary">tune</mat-icon>
          <mat-card-title>{{ p.clave }}</mat-card-title>
          <mat-card-subtitle>{{ p.descripcion }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content class="mt-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Valor Actual</mat-label>
            <input matInput [(ngModel)]="p.valor">
          </mat-form-field>
        </mat-card-content>
        <mat-card-actions align="end">
          <button mat-raised-button color="primary" (click)="guardar(p)">
            <mat-icon>save</mat-icon> Actualizar Parámetro
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</div>
